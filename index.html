<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PeekaPrompt</title>
  <link rel="stylesheet" href="node_modules/@fontsource-variable/bricolage-grotesque/index.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="drawer">
  <div id="tabBubble" aria-hidden="true"></div>
  <div id="tab" class="hit" title="Click to open · drag to move"></div>

  <section id="panel" class="hit">
    <header>
      <div class="brand">
        <span class="mascot-slot badge-bubble"></span>
        <h1>PeekaPrompt</h1>
      </div>
      <div class="actions">
        <button id="pinBtn" class="icon" title="Pin open" aria-label="Pin open"><svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
        <button id="menuBtn" class="icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" class="gear"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="closeBtn" class="icon accent" title="Tuck away (Esc)" aria-label="Tuck away"><svg viewBox="0 0 24 24" class="thick"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </header>

    <div class="statsbar">
      <button id="levelBtn" class="level" title="Your trophies">
        <span id="lvlName"></span>
        <span class="xpbar"><i id="xpFill"></i></span>
      </button>
      <button id="streakPill" class="pill orange" title="Daily streak — use me every day!"><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><span id="streakNum">0</span></button>
      <button id="trophyPill" class="pill lemon" title="Badges"><svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><span id="trophyNum">0</span></button>
    </div>

    <div class="searchrow">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Search your stash…" spellcheck="false" aria-label="Search prompts">
      </label>
      <button id="diceBtn" class="dice" title="Surprise me!" aria-label="Surprise me"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" class="dot"/><circle cx="12" cy="12" r="1.3" class="dot"/><circle cx="15.5" cy="15.5" r="1.3" class="dot"/></svg></button>
    </div>

    <nav id="chips"></nav>

    <button id="newBtn" class="newbtn"><svg viewBox="0 0 24 24" class="thick"><path d="M12 5v14M5 12h14"/></svg>New prompt <kbd>Ctrl+N</kbd></button>
    <form id="composer" hidden>
      <input id="fTitle" type="text" placeholder="Give it a name (optional)" maxlength="80">
      <textarea id="fText" placeholder="Write your prompt here…" spellcheck="true"></textarea>
      <div class="row">
        <select id="fCat"></select>
        <span class="grow"></span>
        <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
        <button type="submit" id="saveBtn" class="btn primary">Save</button>
      </div>
    </form>

    <div id="list"></div>

    <footer>
      <span class="mascot-slot mini"></span>
      <p id="quip"></p>
    </footer>

    <div id="toast"></div>
    <div id="overlay" hidden><div id="dialog"></div></div>
  </section>
  </div>

  <div id="fx"></div>
  <script src="renderer.js"></script>
</body>
</html>
